name: CI

# Build, typecheck and test every package on pull requests and on pushes to
# main and v2. The docs workflow only built and linted; nothing ran the
# test suites before this.
on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm i --frozen-lockfile --prod=false

      - name: Build
        run: pnpm build

      - name: Typecheck core
        run: pnpm --filter @scute/js-core exec tsc --noEmit

      - name: Test
        run: pnpm -r --if-present test
